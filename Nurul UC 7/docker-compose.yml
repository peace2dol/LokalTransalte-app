services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lokaltranslator
      POSTGRES_USER: lokal
      POSTGRES_PASSWORD: lokal_dev_password
    ports: ["5432:5432"]
    volumes:
      - lokal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lokal -d lokaltranslator"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  lokal_pgdata:
